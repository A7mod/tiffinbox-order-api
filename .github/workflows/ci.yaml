name: ci

on:
  push: 
    branches: [main]
  pull_request:               # PRs get tested and scanned, but never pushed

permissions:
  contents: read
  packages: write             # lets GITHUB_TOKEN push to GHCR

env:
  IMAGE: ghcr.io/a7mod/tiffinbox-order-api   # must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test 
        run: go test -race -coverprofile=coverage.out ./...
  image:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tag (short git SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally, do NOT push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: VERSION=${{ env.TAG }}
      - name: Trivy Scan (fail on High/Critical)
        uses: aquasecurity/trivy-action@master   # pin to a release or commit SHA in real use
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}:${{ env.TAG }}  
            