name: ci

on:
  push: 
    branches: [main]
  pull_request:               # PRs get tested and scanned, but never pushed

permissions:
  contents: read
  packages: write             # lets GITHUB_TOKEN push to GHCR

env:
  IMAGE: ghcr.io/a7mod/tiffinbox-order-api   # must be lowercase

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Test 
        run: go test -race -coverprofile=coverage.out ./...
  image:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tag (short git SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally, do NOT push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: VERSION=${{ env.TAG }}
      - name: Trivy Scan (fail on High/Critical)
        uses: aquasecurity/trivy-action@master   # pin to a release or commit SHA in real use
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE }}:${{ env.TAG }}  
  bump:
    needs: image                       # only after the image is scanned + pushed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: gitops-bump           # two pushes at once → bumps run one at a time
    steps:
      - name: Set tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: A7mod/tiffinbox-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump dev image tag
        working-directory: gitops/workloads/order-api/overlays/dev
        run: |
          sed -i "s/newTag: .*/newTag: ${TAG}/" kustomization.yaml
          grep "newTag: ${TAG}" kustomization.yaml     # fail loudly if the edit didn't land
      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "tiffinbox-ci"
          git config user.email "tiffinbox-ci@users.noreply.github.com"
          git diff --quiet && { echo "already at ${TAG}"; exit 0; }
          git commit -am "order-api: deploy ${TAG} to dev"
          git pull --rebase
          git push      
              